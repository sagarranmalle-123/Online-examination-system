<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="actGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="actGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="actGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="650" fill="url(#bgGrad)" rx="12"/>
  <rect x="15" y="15" width="1170" height="620" fill="none" stroke="#cbd5e1" stroke-width="1.5" rx="10"/>

  <!-- Top Title -->
  <text x="600" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">UML ACTIVITY DIAGRAM: EXAM SESSION &amp; AUTOMATED EVALUATION WORKFLOW</text>

  <!-- ================= SWIMLANES ================= -->
  <!-- Lane 1: Student / Examinee -->
  <rect x="35" y="60" width="370" height="560" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <path d="M 35 60 L 405 60 L 405 95 L 35 95 Z" fill="url(#headerGrad1)"/>
  <text x="220" y="83" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. CANDIDATE / STUDENT</text>

  <!-- Lane 2: Exam Client & Proctoring Engine -->
  <rect x="415" y="60" width="370" height="560" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <path d="M 415 60 L 785 60 L 785 95 L 415 95 Z" fill="url(#headerGrad2)"/>
  <text x="600" y="83" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. EXAM CLIENT &amp; PROCTOR</text>

  <!-- Lane 3: Backend & Auto-Evaluation Engine -->
  <rect x="795" y="60" width="370" height="560" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <path d="M 795 60 L 1165 60 L 1165 95 L 795 95 Z" fill="url(#headerGrad3)"/>
  <text x="980" y="83" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3. BACKEND &amp; EVALUATION ENGINE</text>

  <!-- ================= STEP 1: LOGIN ================= -->
  <!-- Start Node -->
  <circle cx="220" cy="118" r="11" fill="#0f172a" filter="url(#shadow)"/>
  <line x1="220" y1="129" x2="220" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action: Enter Credentials -->
  <rect x="130" y="150" width="180" height="38" rx="8" fill="url(#actGrad1)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Enter Login Credentials</text>

  <!-- To Backend: Validate -->
  <path d="M 310 169 L 880 169" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="880" y="150" width="200" height="38" rx="8" fill="url(#actGrad3)" stroke="#4f46e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="980" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#4338ca" text-anchor="middle">Validate User &amp; Role</text>

  <!-- Decision Diamond: Valid? -->
  <line x1="980" y1="188" x2="980" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="980,210 1020,228 980,246 940,228" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="980" y="232" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Valid?</text>

  <!-- If Invalid -> return to Login -->
  <path d="M 1020 228 L 1110 228 L 1110 125 L 220 125 L 220 148" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#redArrow)"/>
  <text x="1060" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">[No: Display Error]</text>

  <!-- If Valid -> Student Dashboard -->
  <path d="M 980 246 L 980 265 L 310 265" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="890" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#16a34a">[Yes: Authenticated]</text>

  <!-- Action: Select Exam & Agree Guidelines -->
  <rect x="120" y="246" width="190" height="38" rx="8" fill="url(#actGrad1)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="215" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#0369a1" text-anchor="middle">Select Exam &amp; Accept Rules</text>

  <!-- To Exam Client: Launch Fullscreen Lockdown -->
  <path d="M 215 284 L 215 315 L 490 315" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action: Initialize Exam Environment -->
  <rect x="490" y="296" width="220" height="38" rx="8" fill="url(#actGrad2)" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="314" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#0f766e" text-anchor="middle">Lock Fullscreen &amp; Start Timer</text>
  <text x="600" y="327" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#0f766e" text-anchor="middle">Enable Tab &amp; Blur Event Listeners</text>

  <!-- Request Questions from Backend -->
  <line x1="710" y1="315" x2="880" y2="315" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="880" y="296" width="200" height="38" rx="8" fill="url(#actGrad3)" stroke="#4f46e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="980" y="314" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#4338ca" text-anchor="middle">Shuffle &amp; Stream Questions</text>
  <text x="980" y="327" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#4338ca" text-anchor="middle">Initialize Server Session Clock</text>

  <!-- Deliver Questions to Client UI -->
  <path d="M 980 334 L 980 365 L 690 365" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= PARALLEL FORK: ATTEMPT vs PROCTOR ================= -->
  <!-- Fork Bar in Client -->
  <line x1="510" y1="365" x2="690" y2="365" stroke="#0f172a" stroke-width="4"/>

  <!-- Branch A: Student Answering Loop -->
  <path d="M 540 367 L 540 395 L 310 395" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="120" y="375" width="190" height="42" rx="8" fill="url(#actGrad1)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="215" y="394" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">Answer / Flag / Navigate</text>
  <text x="215" y="408" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#0369a1" text-anchor="middle">Update Palette Response State</text>

  <!-- Autosave Answer to Backend -->
  <path d="M 310 405 L 880 405" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="600" y="400" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">Async Periodic Autosave</text>

  <!-- Branch B: Active Proctoring Surveillance -->
  <path d="M 660 367 L 660 385" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="660,385 710,405 660,425 610,405" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/>
  <text x="660" y="402" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Tab Switch</text>
  <text x="660" y="413" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#92400e" text-anchor="middle">Detected?</text>

  <!-- Violation Handler -->
  <line x1="710" y1="405" x2="745" y2="405" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M 745 405 L 745 435 L 700 435" stroke="#dc2626" stroke-width="1.5" marker-end="url(#redArrow)"/>
  <rect x="520" y="432" width="180" height="32" rx="6" fill="url(#warnGrad)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="610" y="446" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Warn Candidate &amp; Log Log</text>
  <text x="610" y="458" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="middle">[If Violations &gt; 3: Force Auto-Submit]</text>

  <!-- ================= TERMINATION & SUBMISSION ================= -->
  <!-- Decision: Timer 00:00 or Submit Clicked? -->
  <path d="M 215 417 L 215 480 L 490 480" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="530,480 580,498 530,516 480,498" fill="#f8fafc" stroke="#0d9488" stroke-width="1.5"/>
  <text x="530" y="495" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#0f766e" text-anchor="middle">Submit or</text>
  <text x="530" y="506" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0f766e" text-anchor="middle">Timeout?</text>

  <!-- Lock & Flush Submissions to Backend -->
  <line x1="580" y1="498" x2="880" y2="498" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="493" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#16a34a">[Yes: Finalize]</text>

  <rect x="880" y="478" width="200" height="42" rx="8" fill="url(#actGrad3)" stroke="#4f46e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="980" y="496" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#4338ca" text-anchor="middle">Auto-Evaluate Answers</text>
  <text x="980" y="510" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#4338ca" text-anchor="middle">Compare with Key &amp; Compute Marks</text>

  <!-- Generate Result Scorecard -->
  <line x1="980" y1="520" x2="980" y2="540" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="880" y="540" width="200" height="38" rx="8" fill="url(#actGrad3)" stroke="#4f46e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="980" y="558" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#4338ca" text-anchor="middle">Generate Scorecard &amp; Analytics</text>
  <text x="980" y="571" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#4338ca" text-anchor="middle">Store Results in PostgreSQL DB</text>

  <!-- Display Scorecard to Student -->
  <path d="M 880 559 L 310 559" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="120" y="540" width="190" height="38" rx="8" fill="url(#actGrad1)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="215" y="558" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#0369a1" text-anchor="middle">View Score &amp; Question Review</text>
  <text x="215" y="571" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#0369a1" text-anchor="middle">Download Performance PDF</text>

  <!-- Final Node (End) -->
  <line x1="215" y1="578" x2="215" y2="596" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="215" cy="607" r="11" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="215" cy="607" r="7" fill="#0f172a"/>
</svg>